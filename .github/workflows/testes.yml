name: testes

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Invariantes dos 48 layouts
        run: pytest -q testes/test_extrator.py
      - name: Relatorio layout a layout sobre a massa de demonstracao
        run: python testes/validar_layouts.py
