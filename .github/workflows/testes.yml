name: testes

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q testes/test_extrator.py
      - name: Layouts sobre a massa de demo
        run: |
          python gerar_massa_demo.py
          python testes/validar_layouts.py
